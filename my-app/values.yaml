replicaCount: 2

image:
  repository: bkuslapur/mypythonapp
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx

  hosts:
    - host: myapp.local
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: myapp-tls
      hosts:
        - myapp.local

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50